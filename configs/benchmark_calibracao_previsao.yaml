# Trilha de previsão do CAMS (não comparável com o leaderboard padrão).
# Experimento de calibração da previsão: os modelos do plugin (dom_previsao, gbm_previsao,
# linear_previsao) usam só a previsão do CAMS, as observações até t-1 e o calendário. A
# reanálise continua na tabela (o benchmark exige) mas nenhum desses modelos a lê, porque ela
# não existe no momento real da emissão. Os baselines climatology e persistence também não a
# usam; forecast_raw é a previsão do CAMS sem correção.
# Baseada em ../Benchmark/configs/benchmark_forecast_local.yaml. A reanálise e as
# observações vêm do download verificado por hash (o README do benchmark garante que
# `download` e `local` geram a mesma tabela); as previsões vêm da pasta local, que é a
# única opção para elas nesta versão do benchmark.
data:
  # pasta local: reanálise SISAM 2010-2024 do repositório do Ryan (idêntica ao download
  # oficial) + 2025 (arquivo do SISAM); observações do clone de benchmark_pm2_5
  source: local
  sisam_dir: ../dados_benchmark/sisam
  cetesb_dir: ../benchmark_pm2_5/data
  cams_forecast_dir: ../benchmark_cams_forecast/data
  station: 73          # Congonhas (São Paulo)
  min_hours: 18        # horas válidas mínimas para a média diária
  # divisão definida pelo grupo: treino 2011-2021, validação 2022, teste 2023-2025
  # (o contrato v0.1 do benchmark usa 2011-2019 / 2020-2021 / 2022-2024; os resultados
  # desta config não se comparam com o leaderboard oficial)
  train_end: 2021-12-31
  val_end: 2022-12-31  # teste: a partir de 2023-01-08 (até onde houver reanálise)
  gap_days: 7

models:
  - name: persistence
  - name: climatology
  - name: forecast_raw
  - name: linear_previsao  # mesmas entradas do gbm_previsao (sem reanálise)
  - name: dom_previsao
  - name: gbm_previsao

n_context: 7           # dias de contexto (t-6 ... t)
leads: [0, 1, 2, 3]    # 0 = o próprio dia t
thresholds: [15, 25, 50]
block_days: 7
n_boot: 1000
seed: 42
output_dir: results_calibracao_previsao
